[package]
name = "checkpoint-ts"
version = "0.1.0"
description = "Debug TypeScript/JavaScript via TUI. Checkpoint functions, edit state, skip execution."
authors = ["ErenayDev <erenaydev@proton.me>"]
license = "MIT"
edition = "2024"

[workspace]
members = ["tools/cargo-bin"]

[package.metadata.bin]
cargo-watch = { version = "8.5.2" }

[dependencies]
chrono = "0.4.42"
color-eyre = "0.6.3"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.31"
ratatui = "0.29.0"
serde = "1.0.228"
serde_json = "1.0.145"
throbber-widgets-tui = "0.9.0"
tokio = { version = "1.40.0", features = ["full"] }
