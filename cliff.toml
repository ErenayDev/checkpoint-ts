# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%-d %B %Y") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
        | filter(attribute="scope")
        | sort(attribute="scope") %}
        - **{{ commit.scope }}**: {% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | upper_first }}{% if commit.links %} ({{ commit.links | join(sep=", ") }}){% endif %}
    {% endfor -%}
    {% for commit in commits
        | reject(attribute="scope")
        | sort(attribute="message") %}
        - {% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | upper_first }}{% if commit.links %} ({{ commit.links | join(sep=", ") }}){% endif %}
    {% endfor -%}
{% endfor -%}

---
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true
render_always = true
postprocessors = [
    { pattern = '\$REPO', replace = "https://github.com/your-username/your-repo" },
    { pattern = '<!-- \d+ -->', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}]($REPO/issues/${2}))" },
    { pattern = '\$REPO', replace = "https://github.com/your-username/your-repo" },
]
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "🚀 Features" },
    { message = "^fix", group = "🐛 Bug Fixes" },
    { message = "^perf", group = "⚡ Performance" },
    { message = "^refactor", group = "🚜 Refactor" },
    { message = "^doc", group = "📚 Documentation" },
    { message = "^style", group = "🎨 Styling" },
    { message = "^test", group = "🧪 Testing" },
    { message = "^build", group = "🏗️ Build System" },
    { message = "^ci", group = "👷 CI/CD" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore", group = "⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "🛡️ Security" },
    { message = "^revert", group = "◀️ Revert" },
    { message = ".*", group = "💼 Other" },
]
filter_commits = false
link_parsers = [
    { pattern = "#(\\d+)", href = "$REPO/issues/${1}" },
    { pattern = "RFC(\\d+)", text = "ietf-rfc${1}", href = "https://datatracker.ietf.org/doc/html/rfc${1}" },
]
tag_pattern = "v[0-9].*"
skip_tags = "v0.1.0-beta.1"
ignore_tags = ""
date_order = false
sort_commits = "oldest"
